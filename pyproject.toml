[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-anomaly-detector"
version = "0.1.0"
description = "Phase 1 synthetic weather anomaly detection foundation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "boto3>=1.35",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "api.index:app"
